# up2daite.com – GitLab CI/CD Pipeline
# Doku: docs/VERSIONING.md

stages:
  - security # NEU: Gitleaks + Semgrep (läuft ZUERST)
  - build
  - package
  - scan # Trivy Container-Scan
  - deploy

variables:
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

# ══════════════════════════════════════════════════════════════════════════════
# SECURITY STAGE - Läuft bei JEDEM Push auf JEDEN Branch
# ══════════════════════════════════════════════════════════════════════════════

# ─── GITLEAKS ─────────────────────────────────────────────────────────────────
# WAS: Scannt Git-History + Code nach versehentlich committeten Secrets
# FINDET: API Keys, Passwörter, Tokens, Private Keys, AWS Credentials, etc.
# WARUM WICHTIG: Ein einmal gepushtes Secret ist kompromittiert (Git-History!)
#
# Beispiele was Gitleaks findet:
#   - password = "geheim123"
#   - GITHUB_TOKEN=ghp_xxxxxxxxxxxx
#   - -----BEGIN RSA PRIVATE KEY-----
#
# Docs: https://github.com/gitleaks/gitleaks

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose --redact
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ─── SEMGREP (SAST) ───────────────────────────────────────────────────────────
# WAS: Static Application Security Testing - analysiert Quellcode auf Schwachstellen
# FINDET: SQL Injection, XSS, Command Injection, unsichere Krypto, etc.
# WARUM WICHTIG: Findet Bugs die zur Laufzeit ausnutzbar wären
#
# Beispiele was Semgrep findet:
#   - String query = "SELECT * FROM users WHERE id=" + userId;  → SQL Injection!
#   - eval(userInput)  → Code Injection!
#   - new Random()  → Unsichere Zufallszahlen für Krypto
#
# Regeln: "p/default" = Community-Regeln für Java, JS, Python, etc.
# Docs: https://semgrep.dev/docs/

# semgrep:
#   stage: security
#   image:
#     name: semgrep/semgrep:latest
#     entrypoint: [""]
#   script:
#     - semgrep scan --config=p/default --config=p/security-audit --error --verbose .
#   rules:
#     - if: $CI_PIPELINE_SOURCE == "merge_request_event"
#     - if: $CI_COMMIT_BRANCH

# ─── BUILD ────────────────────────────────────────────────────────────────────

build-frontend:
  stage: build
  image: node:20-alpine
  cache:
    key: "$CI_COMMIT_REF_SLUG-frontend"
    paths: [frontend/node_modules/]
  script:
    - cd frontend && npm ci && npm run build
  artifacts:
    paths: [frontend/dist/]
    expire_in: 1 hour

build-backend:
  stage: build
  image: maven:3.9-eclipse-temurin-21-alpine
  cache:
    key: "$CI_COMMIT_REF_SLUG-backend"
    paths: [backend/.m2/]
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=backend/.m2"
  script:
    - cd backend && mvn clean verify -q
  artifacts:
    paths: [backend/target/*.jar]
    expire_in: 1 hour

# ─── PACKAGE (Entwicklung: main branch) ───────────────────────────────────────

package-frontend:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64)\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context $CI_PROJECT_DIR/frontend
      --dockerfile $CI_PROJECT_DIR/frontend/Dockerfile
      --destination $FRONTEND_IMAGE:$IMAGE_TAG
      --destination $FRONTEND_IMAGE:latest
      --destination $FRONTEND_IMAGE:snapshot
      --cache=true --cache-ttl=24h
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == null

package-frontend-branch:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64)\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context $CI_PROJECT_DIR/frontend
      --dockerfile $CI_PROJECT_DIR/frontend/Dockerfile
      --destination $FRONTEND_IMAGE:$CI_COMMIT_REF_SLUG
      --cache=false
  rules:
    - if: $CI_COMMIT_BRANCH == "ai-news-app"

package-backend:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64)\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context $CI_PROJECT_DIR/backend
      --dockerfile $CI_PROJECT_DIR/backend/Dockerfile
      --destination $BACKEND_IMAGE:$IMAGE_TAG
      --destination $BACKEND_IMAGE:latest
      --destination $BACKEND_IMAGE:snapshot
      --cache=true --cache-ttl=24h
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == null

package-backend-branch:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64)\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context $CI_PROJECT_DIR/backend
      --dockerfile $CI_PROJECT_DIR/backend/Dockerfile
      --destination $BACKEND_IMAGE:$CI_COMMIT_REF_SLUG
      --cache=false
  rules:
    - if: $CI_COMMIT_BRANCH == "ai-news-app"

# ─── PACKAGE (Release: git tag v*) ────────────────────────────────────────────

release-frontend:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64)\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context $CI_PROJECT_DIR/frontend
      --dockerfile $CI_PROJECT_DIR/frontend/Dockerfile
      --destination $FRONTEND_IMAGE:$IMAGE_TAG
      --destination $FRONTEND_IMAGE:$CI_COMMIT_TAG
      --destination $FRONTEND_IMAGE:stable
      --cache=true --cache-ttl=24h
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

release-backend:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64)\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context $CI_PROJECT_DIR/backend
      --dockerfile $CI_PROJECT_DIR/backend/Dockerfile
      --destination $BACKEND_IMAGE:$IMAGE_TAG
      --destination $BACKEND_IMAGE:$CI_COMMIT_TAG
      --destination $BACKEND_IMAGE:stable
      --cache=true --cache-ttl=24h
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ─── SCAN (Trivy) ─────────────────────────────────────────────────────────────

scan-frontend:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress $FRONTEND_IMAGE:$IMAGE_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

scan-backend:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress $BACKEND_IMAGE:$IMAGE_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ─── DEPLOY (K8s) ─────────────────────────────────────────────────────────────

deploy-frontend:
  stage: deploy
  image: dtzar/helm-kubectl:latest
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
  script:
    - kubectl set image deployment/frontend frontend=$FRONTEND_IMAGE:$CI_COMMIT_REF_SLUG -n up2daite-staging
    - kubectl rollout restart deployment/frontend -n up2daite-staging
    - kubectl rollout status deployment/frontend -n up2daite-staging --timeout=120s
  environment:
    name: staging
    url: http://31.70.75.157
  rules:
    - if: $CI_COMMIT_BRANCH == "ai-news-app"

deploy-backend:
  stage: deploy
  image: dtzar/helm-kubectl:latest
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
  script:
    - kubectl set image deployment/backend backend=$BACKEND_IMAGE:$CI_COMMIT_REF_SLUG -n up2daite-staging
    - kubectl rollout restart deployment/backend -n up2daite-staging
    - kubectl rollout status deployment/backend -n up2daite-staging --timeout=180s
  environment:
    name: staging
    url: http://31.70.75.157
  rules:
    - if: $CI_COMMIT_BRANCH == "ai-news-app"
