# ─────────────────────────────────────────────────────────────────────────────
# up2daite.com – GitLab CI/CD Pipeline
#
# Stages:
#   build   → TypeScript + Vite (jeder Push)
#   package → Kaniko: Docker-Image bauen + pushen (nur main)
#   deploy  → kubectl: Deployment im Cluster aktualisieren (nur main)
#
# Geplant (noch nicht aktiv):
#   scan    → Tenable Container-Scan (zwischen package und deploy)
# ─────────────────────────────────────���───────────────────────────────────────

stages:
  - build
  - package
  - deploy

variables:
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  KUBE_NAMESPACE: up2daite-staging

# ─── Stage: build ─────────────────────────────────────────────────────────────
# Kein rules-Block → läuft bei jedem Push auf jedem Branch

build-frontend:
  stage: build
  image: node:20-alpine
  cache:
    key: "$CI_COMMIT_REF_SLUG-frontend"
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    name: frontend-dist
    paths:
      - frontend/dist/
    expire_in: 1 hour

# ★ Backend Build — Maven kompiliert und testet das Spring Boot Projekt
build-backend:
  stage: build
  image: maven:3.9-eclipse-temurin-21-alpine
  cache:
    key: "$CI_COMMIT_REF_SLUG-backend"
    paths:
      - backend/.m2/
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=backend/.m2"
  script:
    - cd backend
    - mvn clean verify -q
  artifacts:
    name: backend-jar
    paths:
      - backend/target/*.jar
    expire_in: 1 hour

# ─── Stage: package ───────────────────────────────────────────────────────────
# Kaniko baut das Image ohne Docker-Daemon (kein privileged-Modus nötig).

package-frontend:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64)\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context $CI_PROJECT_DIR/frontend
      --dockerfile $CI_PROJECT_DIR/frontend/Dockerfile
      --destination $FRONTEND_IMAGE:$IMAGE_TAG
      --destination $FRONTEND_IMAGE:latest
      --cache=true
      --cache-ttl=24h
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ★ Backend Image bauen — Kaniko baut ohne Docker-Daemon
package-backend:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64)\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context $CI_PROJECT_DIR/backend
      --dockerfile $CI_PROJECT_DIR/backend/Dockerfile
      --destination $BACKEND_IMAGE:$IMAGE_TAG
      --destination $BACKEND_IMAGE:latest
      --cache=true
      --cache-ttl=24h
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ─── Stage: deploy ────────────────────────────────────────────────────────────
# Rollt das neue Image im Cluster aus. Wartet auf erfolgreichen Rollout.

# ★ Deploy-Jobs sind MANUELL — Shared Runners haben keinen Cluster-Zugriff
# Für automatisches Deployment: kubeconfig als CI/CD Variable hinterlegen
# oder selbst-gehosteten Runner mit Cluster-Zugang nutzen

deploy-frontend:
  stage: deploy
  image: dtzar/helm-kubectl:latest
  script:
    - kubectl set image deployment/frontend
        frontend=$FRONTEND_IMAGE:$IMAGE_TAG
        -n $KUBE_NAMESPACE
    - kubectl rollout status deployment/frontend
        -n $KUBE_NAMESPACE
        --timeout=120s
  environment:
    name: staging
    url: http://up2daite.local
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

deploy-backend:
  stage: deploy
  image: dtzar/helm-kubectl:latest
  script:
    - kubectl set image deployment/backend
        backend=$BACKEND_IMAGE:$IMAGE_TAG
        -n $KUBE_NAMESPACE
    - kubectl rollout status deployment/backend
        -n $KUBE_NAMESPACE
        --timeout=180s
  environment:
    name: staging
    url: http://up2daite.local
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
