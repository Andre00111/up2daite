# ─────────────────────────────────────────────────────────────────────────────
# up2daite.com – GitLab CI/CD Pipeline
#
# Stages:
#   build   → Code kompilieren + testen
#   package → Docker-Images bauen + pushen (nur main)
#   scan    → Trivy Security Scan der Images
#   deploy  → [DEAKTIVIERT] K8s Deployment — siehe unten
#
# Lokal entwickeln: docker compose up
# K8s aktivieren:   siehe k8s/README.md + Deploy-Block unten einkommentieren
# ─────────────────────────────────────────────────────────────────────────────

stages:
  - build
  - package
  - scan
  # - deploy  # ← Einkommentieren wenn Cloud-Cluster bereit

variables:
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

# ─── Stage: build ─────────────────────────────────────────────────────────────

build-frontend:
  stage: build
  image: node:20-alpine
  cache:
    key: "$CI_COMMIT_REF_SLUG-frontend"
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    name: frontend-dist
    paths:
      - frontend/dist/
    expire_in: 1 hour

build-backend:
  stage: build
  image: maven:3.9-eclipse-temurin-21-alpine
  cache:
    key: "$CI_COMMIT_REF_SLUG-backend"
    paths:
      - backend/.m2/
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=backend/.m2"
  script:
    - cd backend
    - mvn clean verify -q
  artifacts:
    name: backend-jar
    paths:
      - backend/target/*.jar
    expire_in: 1 hour

# ─── Stage: package ───────────────────────────────────────────────────────────

package-frontend:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64)\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context $CI_PROJECT_DIR/frontend
      --dockerfile $CI_PROJECT_DIR/frontend/Dockerfile
      --destination $FRONTEND_IMAGE:$IMAGE_TAG
      --destination $FRONTEND_IMAGE:latest
      --cache=true
      --cache-ttl=24h
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

package-backend:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64)\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context $CI_PROJECT_DIR/backend
      --dockerfile $CI_PROJECT_DIR/backend/Dockerfile
      --destination $BACKEND_IMAGE:$IMAGE_TAG
      --destination $BACKEND_IMAGE:latest
      --cache=true
      --cache-ttl=24h
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ─── Stage: scan ──────────────────────────────────────────────────────────────
# Trivy scannt die Images auf bekannte Vulnerabilities (CVEs).
# Bei CRITICAL oder HIGH Findings schlägt der Job fehl.

scan-frontend:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - trivy image
      --exit-code 1
      --severity CRITICAL,HIGH
      --ignore-unfixed
      --no-progress
      --format table
      $FRONTEND_IMAGE:$IMAGE_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: false

scan-backend:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - trivy image
      --exit-code 1
      --severity CRITICAL,HIGH
      --ignore-unfixed
      --no-progress
      --format table
      $BACKEND_IMAGE:$IMAGE_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: false

