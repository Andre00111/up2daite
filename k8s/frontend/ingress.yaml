# ★ INGRESS — Eingangstor von außen in den Cluster
#
# Services sind nur intern erreichbar.
# Ein Ingress macht einen Service von außen erreichbar — per Domain + HTTP.
#
# Ablauf einer Anfrage:
#   Browser → up2daite.local → Ingress → Service "frontend" → Pod
#
# Voraussetzung: ein Ingress-Controller muss im Cluster laufen.
# Für minikube: minikube addons enable ingress

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: up2daite-staging
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: up2daite
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

spec:
  ingressClassName: nginx   # welcher Ingress-Controller soll das verarbeiten

  rules:
    # ★ Kein Host = akzeptiert alle Anfragen (auch per IP)
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
