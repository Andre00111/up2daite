# ★ INGRESS — Eingangstor von außen in den Cluster
#
# Services sind nur intern erreichbar.
# Ein Ingress macht einen Service von außen erreichbar — per Domain + HTTP.
#
# Ablauf einer Anfrage:
#   Browser → todoapp.local → Ingress → Service "frontend" → Pod
#
# Voraussetzung: ein Ingress-Controller muss im Cluster laufen.
# Für minikube: minikube addons enable ingress

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: todoapp-staging
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: todoapp
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

spec:
  ingressClassName: traefik   # k3s verwendet Traefik

  rules:
    # Ohne host = akzeptiert alle Anfragen (auch direkt per IP)
    - http:
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              # ★ Welcher Service bekommt den Traffic?
              service:
                name: frontend   # muss mit service.yaml name: übereinstimmen
                port:
                  number: 80
