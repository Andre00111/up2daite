# ★ DEPLOYMENT — beschreibt WIE die App laufen soll
#
# Ein Deployment sagt Kubernetes:
#   "Sorge dafür, dass immer X Kopien dieses Containers laufen."
# Kubernetes übernimmt den Rest: starten, neustarten, updaten.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: up2daite-staging

  # Labels sind reine Metadaten — wie Aufkleber auf einer Box.
  # Sie werden von Service und anderen Objekten genutzt um Pods zu finden.
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: up2daite

spec:
  # ★ Wie viele Kopien (Pods) sollen laufen?
  replicas: 1

  # ★ SELECTOR — das Herzstück der Verknüpfung
  # Kubernetes fragt sich: "Welche Pods gehören zu diesem Deployment?"
  # Antwort: alle Pods die dieses Label haben.
  # MUSS identisch mit template.metadata.labels unten sein.
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend

  # Rolling Update: neuer Pod startet BEVOR der alte stirbt → kein Ausfall
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # nie weniger als replicas Pods laufen lassen
      maxSurge: 1         # kurzzeitig 1 Pod mehr erlaubt (der neue)

  # ★ TEMPLATE — die Schablone für jeden Pod
  # Alles unter "template" beschreibt wie ein einzelner Pod aussieht.
  template:
    metadata:
      # ★ Diese Labels MÜSSEN mit selector.matchLabels übereinstimmen
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: up2daite

    spec:
      # Zugangsdaten zur privaten GitLab Registry
      imagePullSecrets:
        - name: gitlab-registry

      # Security: Container darf nicht als root laufen
      securityContext:
        runAsNonRoot: true
        runAsUser: 101      # nginx user in nginx-unprivileged image
        runAsGroup: 101
        fsGroup: 101

      containers:
        - name: frontend
          image: registry.gitlab.com/andre00111/up2daite/frontend:latest

          # Security: Keine Privilege Escalation erlauben
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]

          ports:
            - containerPort: 8080   # nginx-unprivileged lauscht auf 8080
              name: http

          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
