# ★ POSTGRES CREDENTIALS SECRET — Zugangsdaten für die Datenbank
#
# WICHTIG: Diese Datei ist ein TEMPLATE. In Produktion:
# - Nicht in Git committen (oder mit sealed-secrets/SOPS verschlüsseln)
# - Über CI/CD oder Vault injizieren
#
# Für lokales Testen mit minikube kannst du diese Datei direkt anwenden:
#   kubectl apply -f k8s/postgres/secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: todoapp-staging
  labels:
    app.kubernetes.io/part-of: todoapp

type: Opaque
stringData:
  # ★ stringData erlaubt Klartext — K8s encodiert automatisch zu Base64
  # Für Staging OK, für Produktion: echte Passwörter + Secret Management
  username: todoapp
  password: todoapp
