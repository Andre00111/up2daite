# ★ POSTGRES DEPLOYMENT — Datenbank für das Backend
#
# In Produktion sollte man einen managed Service (z.B. Cloud SQL, RDS) nutzen.
# Für Staging/Dev ist ein Pod mit PersistentVolume ausreichend.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: up2daite-staging
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: up2daite

spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres

  # ★ Recreate statt RollingUpdate: Datenbanken sollten nicht parallel laufen
  # (sonst könnten zwei Pods gleichzeitig auf das Volume zugreifen)
  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: up2daite

    spec:
      # Security: Container darf nicht als root laufen
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001     # bitnami postgres user
        runAsGroup: 1001
        fsGroup: 1001

      containers:
        - name: postgres
          # bitnami/postgresql läuft als non-root (UID 1001)
          image: bitnami/postgresql:16

          # Security: Keine Privilege Escalation
          securityContext:
            allowPrivilegeEscalation: false

          ports:
            - containerPort: 5432
              name: postgres

          # ★ Credentials aus Secret laden
          # Bitnami nutzt andere Env-Variablen als das offizielle Image
          env:
            - name: POSTGRESQL_DATABASE
              value: up2daite
            - name: POSTGRESQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # ★ Volume für persistente Daten
          volumeMounts:
            - name: postgres-data
              mountPath: /bitnami/postgresql    # Bitnami data directory

          # ★ Readiness: pg_isready prüft ob Postgres Verbindungen annimmt
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "up2daite"]
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "up2daite"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
