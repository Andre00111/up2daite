# ★ BACKEND DEPLOYMENT — Spring Boot API Server
#
# Stellt die REST API bereit. Verbindet sich zur PostgreSQL Datenbank.
# Wird nur intern vom Frontend (nginx-Proxy) angesprochen, nicht direkt von außen.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: up2daite-staging
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: up2daite
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: up2daite
    spec:
      imagePullSecrets:
        - name: gitlab-registry

      # Security: Container darf nicht als root laufen
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      containers:
        - name: backend
          image: registry.gitlab.com/andre00111/up2daite/backend:ai-news-app

          # Security: Keine Privilege Escalation erlauben
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]

          ports:
            - containerPort: 8080
              name: http

          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: up2daite
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password

            # ── Auth ────────────────────────────────────────────────────
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-auth-credentials
                  key: jwt-secret
            - name: ADMIN_ANDRE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-auth-credentials
                  key: admin-andre-password
            - name: ADMIN_MARTIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-auth-credentials
                  key: admin-martin-password
            - name: ADMIN_ADMIN4653_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-auth-credentials
                  key: admin-admin4653-password
            # HTTPS aktiv (up2daite.com) → Secure-Cookie an.
            - name: COOKIE_SECURE
              value: "true"

            # ── CORS & App-URL ──────────────────────────────────────────
            - name: CORS_ALLOWED_ORIGINS
              value: "https://up2daite.com,http://31.70.75.157"
            - name: APP_BASE_URL
              value: "https://up2daite.com"

            # ── Newsletter (Brevo) ──────────────────────────────────────
            - name: BREVO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: brevo-credentials
                  key: api-key
            - name: BREVO_SENDER_EMAIL
              value: "hello@up2daite.com"
            - name: BREVO_SENDER_NAME
              value: "up2daite"

          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
