# ★ BACKEND DEPLOYMENT — Spring Boot API Server
#
# Stellt die REST API bereit. Verbindet sich zur PostgreSQL Datenbank.
# Wird nur intern vom Frontend (nginx-Proxy) angesprochen, nicht direkt von außen.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: todoapp-staging
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: todoapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: todoapp
    spec:
      imagePullSecrets:
        - name: gitlab-registry

      # Security: Container darf nicht als root laufen
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      containers:
        - name: backend
          image: registry.gitlab.com/andre00111/todoapp/backend:latest

          # Security: Keine Privilege Escalation erlauben
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]

          ports:
            - containerPort: 8080
              name: http

          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: todoapp
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password

          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
