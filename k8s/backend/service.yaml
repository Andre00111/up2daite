# ★ BACKEND SERVICE — macht das Backend im Cluster erreichbar
#
# Das Frontend (nginx) proxied /api Requests hierher.
# ClusterIP (default) = nur intern erreichbar — kein direkter Zugriff von außen.

apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: todoapp-staging
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: todoapp
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
