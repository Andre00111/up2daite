spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:up2daite}
    username: ${DB_USER:up2daite}
    password: ${DB_PASSWORD:up2daite}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway verwaltet das Schema — Hibernate soll es nur prüfen
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info   # Actuator health endpoint für Kubernetes-Probe
  endpoint:
    health:
      show-details: always
