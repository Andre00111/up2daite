spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:up2daite}
    username: ${DB_USER:up2daite}
    password: ${DB_PASSWORD:up2daite}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway verwaltet das Schema — Hibernate soll es nur prüfen
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

# ─── App-spezifische Konfiguration ──────────────────────────────────────────
app:
  jwt:
    # Min. 32 Zeichen (256-bit für HS256). In Produktion über K8s Secret.
    secret: ${JWT_SECRET:dev-secret-change-me-in-production-min-32-chars}
  cookie:
    # In Produktion auf true (HTTPS Pflicht); lokal auf false (HTTP).
    secure: ${COOKIE_SECURE:false}
  cors:
    # Kommagetrennt: "http://localhost:43000,https://up2daite.com"
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:43000,http://localhost:5173,http://localhost:3000,http://31.70.75.157}
  admin:
    andre:
      password: ${ADMIN_ANDRE_PASSWORD:}
    martin:
      password: ${ADMIN_MARTIN_PASSWORD:}
    admin4653:
      password: ${ADMIN_ADMIN4653_PASSWORD:}
  base-url: ${APP_BASE_URL:http://localhost:43000}
  brevo:
    api-key: ${BREVO_API_KEY:}
    sender-email: ${BREVO_SENDER_EMAIL:hello@up2daite.com}
    sender-name: ${BREVO_SENDER_NAME:up2daite}
