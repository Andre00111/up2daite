<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${edition.title}">Newsletter</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 640px; margin: 0 auto; padding: 24px; color: #1e293b;">

    <p style="color: #6366f1; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin: 0;">
        Ausgabe <span th:text="${edition.number}">#1</span>
    </p>

    <h1 style="font-size: 28px; margin: 8px 0 24px;" th:text="${edition.title}">Titel</h1>

    <p th:if="${edition.editorNote}" style="color: #475569; line-height: 1.6;" th:text="${edition.editorNote}">
        Editor's Note
    </p>

    <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 32px 0;">

    <div th:each="story : ${stories}" style="margin-bottom: 32px;">
        <h2 style="font-size: 20px; margin-bottom: 8px;" th:text="${story.title}">Story-Titel</h2>
        <p style="color: #64748b; line-height: 1.6;" th:text="${story.editorialComment}">Kommentar</p>
        <p th:if="${story.sourceUrl}">
            <a th:href="${story.sourceUrl}" style="color: #6366f1; text-decoration: none;" th:text="${story.sourceName ?: 'Quelle ansehen'}">
                Quelle
            </a>
        </p>
    </div>

    <div style="text-align: center; margin: 40px 0;">
        <a th:href="${editionUrl}"
           style="background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); color: white; padding: 12px 24px; text-decoration: none; border-radius: 8px; font-weight: 600;">
            Gesamte Ausgabe lesen
        </a>
    </div>

    <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 32px 0;">

    <p style="color: #94a3b8; font-size: 12px; text-align: center;">
        Du erhältst diese E-Mail, weil du dich für den up2daite-Newsletter angemeldet hast.<br>
        <a th:href="${unsubscribeUrl}" style="color: #94a3b8;">Abmelden</a>
    </p>
</body>
</html>
