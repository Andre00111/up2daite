# Lokale Entwicklungsumgebung — baut aus Source Code
#
# Starten:        docker compose -f docker-compose.dev.yml up --build
# Nur Backend:    docker compose -f docker-compose.dev.yml up postgres backend
# Frontend-Dev:   cd frontend && npm run dev  (mit Hot Reload, empfohlen)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: up2daite
      POSTGRES_USER: up2daite
      POSTGRES_PASSWORD: up2daite
    ports:
      - "45432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U up2daite"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "48080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: up2daite
      DB_USER: up2daite
      DB_PASSWORD: up2daite
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # ★ M2-Cache mounten: Maven sucht hier nach Dependencies
      # → Dependencies werden einmal runtergeladen, danach aus Host-Cache benutzt
      # → Ohne Mount: jeder Build lädt ~3800 JARs neu (750s), mit Mount: nur pom.xml-Änderungen (instant)
      - ~/.m2/repository:/root/.m2/repository:cached

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "43000:8080"
    depends_on:
      - backend
    restart: unless-stopped

  # prometheus:
  #   image: prom/prometheus:latest
  #   ports:
  #     - "49090:9090"
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus_data:/prometheus
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #     - '--storage.tsdb.path=/prometheus'
  #   depends_on:
  #     - backend
  #   restart: unless-stopped

  # grafana:
  #   image: grafana/grafana:latest
  #   ports:
  #     - "43001:3000"
