# ★ NGINX KONFIGURATION für das Frontend in K8s/Docker
#
# Problem: Im Dev-Modus macht Vite den Proxy (/api → Backend).
#          Im Production-Build (nginx) gibt es keinen Proxy.
#
# Lösung: nginx übernimmt das Proxying.
#         /api/* Requests → Backend-Service
#         Alles andere → React SPA (index.html)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ★ API PROXY — leitet /api Requests an das Backend weiter
    # In K8s: "backend" ist der Service-Name (DNS-Auflösung durch K8s)
    # In docker-compose: "backend" ist der Container-Name
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;

        # Standard Proxy-Header
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts für langsame Requests
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ★ SPA FALLBACK — React Router braucht das
    # Alle nicht-existierenden Pfade → index.html
    # Sonst gibt es 404 bei direktem Aufruf von z.B. /editions/123
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ★ CACHING für statische Assets (JS, CSS, Bilder)
    # Vite generiert Dateinamen mit Hash → können lange gecacht werden
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip für kleinere Responses
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
